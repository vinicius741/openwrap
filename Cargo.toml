[workspace]
members = [
  "src-tauri",
  "crates/openwrap-core",
  "crates/openwrap-helper",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.2.0"
authors = ["OpenWrap Contributors"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7.0"
hmac = "0.13"
libc = "0.2"
once_cell = "1.21"
parking_lot = "0.13"
regex = "1.13"
rusqlite = { version = "0.41", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
sha2 = "0.11"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-build = { version = "2.7" }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-updater = "2.14"
thiserror = "2.0"
tokio = { version = "1.54", features = ["full"] }
uuid = { version = "1.29", features = ["serde", "v4"] }
zeroize = { version = "1.9", features = ["std"] }
