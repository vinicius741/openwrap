# Continuous validation for pushes and PRs (macOS job below, plus a Windows job).
#
# Mirrors the Release workflow's verification steps on the same runner
# (macos-15 / arm64) so a dependency or code change is proven against the
# platform OpenWrap actually ships on before it lands on main:
# npm tests, helper release build, core+app test suites, and a full
# ad-hoc Tauri app build (no signing secrets needed at this stage).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: |
          npm test
          cargo build -p openwrap-helper --release
          cargo test -p openwrap-core -p openwrap-app

      - name: Build OpenWrap.app (unsigned)
        run: npx --yes @tauri-apps/cli@2 build --bundles app

  # Windows: OpenWrap runs elevated and launches openvpn.exe directly (no setuid
  # helper). Proves the Windows build compiles and tests pass, and publishes the
  # unsigned NSIS installer as a workflow artifact for manual testing.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: |
          npm test
          cargo test -p openwrap-core -p openwrap-app

      - name: Verify test binaries do not require elevation
        shell: pwsh
        run: |
          $testBins = Get-ChildItem -Path target/debug -Recurse -Filter "openwrap_app_lib-*.exe"
          if (-not $testBins) { throw "No openwrap-app test binary found" }
          foreach ($bin in $testBins) {
            $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($bin.FullName))
            if ($text.Contains("requireAdministrator")) {
              throw "requireAdministrator manifest leaked into test binary $($bin.Name)"
            }
          }
          Write-Host "Confirmed: openwrap-app test binary does not embed requireAdministrator."

      # Uses the same script the installer and the in-app "Install OpenVPN"
      # button ship, so its download, checksum and silent MSI install run on
      # every push.
      - name: Install OpenVPN Community with the bundled setup script
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File src-tauri/windows/install-openvpn.ps1
          if ($LASTEXITCODE -ne 0) { throw "install-openvpn.ps1 failed (exit $LASTEXITCODE)" }
          $exe = "C:\Program Files\OpenVPN\bin\openvpn.exe"
          if (-not (Test-Path $exe)) { throw "OpenVPN executable not found at $exe after install" }
          & $exe --version | Select-Object -First 3

      - name: Run real OpenVPN Windows E2E tests
        run: cargo test -p openwrap-core --test windows_openvpn_e2e -- --ignored --nocapture

      - name: Build OpenWrap installer (unsigned)
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - name: Verify app manifest and NSIS install/uninstall
        shell: pwsh
        run: |
          $appExe = "target/release/openwrap-app.exe"
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes((Resolve-Path $appExe)))
          if (-not $text.Contains("requireAdministrator")) {
            throw "openwrap-app.exe is missing requireAdministrator manifest"
          }
          Write-Host "Confirmed: openwrap-app.exe embeds requireAdministrator."

          $installer = Get-ChildItem -Path target/release/bundle/nsis -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          $installDir = Join-Path $env:TEMP "openwrap-nsis-test"
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }

          Write-Host "Running silent install of $($installer.Name) to $installDir..."
          $p = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent install exited with $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $installDir "openwrap-app.exe"))) {
            throw "Installed openwrap-app.exe not found in $installDir"
          }
          $setupScript = Join-Path $installDir "install-openvpn.ps1"
          if (-not (Test-Path $setupScript)) {
            throw "install-openvpn.ps1 not bundled in $installDir"
          }
          # OpenVPN was installed above, so the bundled setup script must find it.
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $setupScript -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw "install-openvpn.ps1 -CheckOnly did not find OpenVPN (exit $LASTEXITCODE)" }
          Write-Host "Confirmed: install-openvpn.ps1 is bundled and detects OpenVPN."

          $uninstaller = Join-Path $installDir "uninstall.exe"
          if (-not (Test-Path $uninstaller)) {
            throw "uninstall.exe not found in $installDir"
          }

          Write-Host "Running silent uninstall..."
          $u = Start-Process -FilePath $uninstaller -ArgumentList "/S", "_?=$installDir" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Silent uninstall exited with $($u.ExitCode)" }
          if (Test-Path (Join-Path $installDir "openwrap-app.exe")) {
            throw "openwrap-app.exe still exists after uninstall"
          }
          Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue
          Write-Host "Confirmed: NSIS silent install and uninstall succeeded."

      # Existing Windows users: installing this build over the released one must
      # keep %LOCALAPPDATA%\OpenWrap (profiles, settings, logs) and, in the
      # in-app update mode (/UPDATE), relaunch OpenWrap from hooks.nsh.
      - name: Verify upgrade over the released build keeps data and relaunches
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $prev = Join-Path $env:RUNNER_TEMP "openwrap-previous"
          New-Item -ItemType Directory -Force -Path $prev | Out-Null
          gh release download --repo $env:GITHUB_REPOSITORY --pattern OpenWrap-Windows-Setup.exe --dir $prev --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not download the released OpenWrap-Windows-Setup.exe" }
          $oldInstaller = Join-Path $prev "OpenWrap-Windows-Setup.exe"
          $newInstaller = (Get-ChildItem -Path target/release/bundle/nsis -Filter "*.exe" | Select-Object -First 1).FullName

          # Where the installer put OpenWrap, from its uninstall registry entry
          # (what the in-app updater relies on too), with a file-system fallback.
          function Find-OpenWrapInstall {
            $keys = @(
              "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*"
            )
            $entry = Get-ItemProperty -Path $keys -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -eq "OpenWrap" } | Select-Object -First 1
            if ($entry -and $entry.UninstallString) {
              $dir = Split-Path -Parent ($entry.UninstallString.Trim('"'))
              if (Test-Path (Join-Path $dir "openwrap-app.exe")) { return $dir }
            }
            foreach ($dir in @((Join-Path $env:ProgramFiles "OpenWrap"), (Join-Path ${env:ProgramFiles(x86)} "OpenWrap"), (Join-Path $env:LOCALAPPDATA "Programs\OpenWrap"), (Join-Path $env:LOCALAPPDATA "OpenWrap"))) {
              if ($dir -and (Test-Path (Join-Path $dir "openwrap-app.exe"))) { return $dir }
            }
            return $null
          }

          Write-Host "Installing the released build..."
          $p = Start-Process -FilePath $oldInstaller -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Released installer exited with $($p.ExitCode)" }
          $installDir = $null
          for ($i = 0; $i -lt 60 -and -not $installDir; $i++) {
            $installDir = Find-OpenWrapInstall
            if (-not $installDir) { Start-Sleep -Seconds 1 }
          }
          if (-not $installDir) {
            Get-ItemProperty -Path "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*", "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like "*OpenWrap*" } | Format-List DisplayName, UninstallString, InstallLocation | Out-String | Write-Host
            Get-ChildItem -Path $env:ProgramFiles, $env:LOCALAPPDATA -Filter "openwrap-app.exe" -Recurse -Depth 3 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "found: $($_.FullName)" }
            throw "Released build was not found after a silent install"
          }
          $installedExe = Join-Path $installDir "openwrap-app.exe"
          $releasedHash = (Get-FileHash $installedExe).Hash
          Write-Host "Released build installed at $installDir"

          $dataDir = Join-Path $env:LOCALAPPDATA "OpenWrap"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $marker = Join-Path $dataDir "ci-upgrade-marker.txt"
          Set-Content -Path $marker -Value "keep me"

          Write-Host "Installing this build in update mode (/S /UPDATE)..."
          # Not -Wait: it also waits for descendants, and in update mode the
          # installer relaunches OpenWrap, which keeps running. Wait for the
          # installer process only (reading Handle keeps ExitCode available).
          $p = Start-Process -FilePath $newInstaller -ArgumentList "/S", "/UPDATE" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(300000)) { throw "Update install did not finish within 5 minutes" }
          if ($p.ExitCode -ne 0) { throw "Update install exited with $($p.ExitCode)" }

          $relaunched = $false
          for ($i = 0; $i -lt 100 -and -not $relaunched; $i++) {
            if (Get-Process -Name "openwrap-app" -ErrorAction SilentlyContinue) { $relaunched = $true } else { Start-Sleep -Milliseconds 200 }
          }
          Get-Process -Name "openwrap-app" -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          if (-not $relaunched) { throw "OpenWrap was not relaunched after the update install" }
          Write-Host "Confirmed: update mode relaunches OpenWrap."

          # Not compared with target/release/openwrap-app.exe: Tauri patches a
          # bundle-type marker into the copy it packs into the installer.
          if ((Get-FileHash $installedExe).Hash -eq $releasedHash) {
            throw "Installed openwrap-app.exe was not replaced by this build"
          }
          if ((Get-Content $marker -Raw).Trim() -ne "keep me") { throw "User data in $dataDir was not preserved" }
          Write-Host "Confirmed: upgrade replaced the app and kept $dataDir."

          $u = Start-Process -FilePath (Join-Path $installDir "uninstall.exe") -ArgumentList "/S", "_?=$installDir" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Silent uninstall exited with $($u.ExitCode)" }
          if (-not (Test-Path $marker)) { throw "Uninstall removed user data in $dataDir" }
          Remove-Item -Recurse -Force $installDir, $marker -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: openwrap-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
