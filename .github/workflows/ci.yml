# Continuous validation for pushes and PRs (macOS job below, plus a Windows job).
#
# Mirrors the Release workflow's verification steps on the same runner
# (macos-15 / arm64) so a dependency or code change is proven against the
# platform OpenWrap actually ships on before it lands on main:
# npm tests, helper release build, core+app test suites, and a full
# ad-hoc Tauri app build (no signing secrets needed at this stage).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: |
          npm test
          cargo build -p openwrap-helper --release
          cargo test -p openwrap-core -p openwrap-app

      - name: Build OpenWrap.app (unsigned)
        run: npx --yes @tauri-apps/cli@2 build --bundles app

  # Windows: OpenWrap runs elevated and launches openvpn.exe directly (no setuid
  # helper). Proves the Windows build compiles and tests pass, and publishes the
  # unsigned NSIS installer as a workflow artifact for manual testing.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: |
          npm test
          cargo test -p openwrap-core -p openwrap-app

      - name: Verify test binaries do not require elevation
        shell: pwsh
        run: |
          $testBins = Get-ChildItem -Path target/debug -Recurse -Filter "openwrap_app_lib-*.exe"
          if (-not $testBins) { throw "No openwrap-app test binary found" }
          foreach ($bin in $testBins) {
            $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($bin.FullName))
            if ($text.Contains("requireAdministrator")) {
              throw "requireAdministrator manifest leaked into test binary $($bin.Name)"
            }
          }
          Write-Host "Confirmed: openwrap-app test binary does not embed requireAdministrator."

      - name: Install OpenVPN Community for Windows E2E
        shell: pwsh
        run: |
          $exe = "C:\Program Files\OpenVPN\bin\openvpn.exe"
          $pinnedVersion = "2.7.9"
          if (-not (Test-Path $exe)) {
            if (Get-Command winget -ErrorAction SilentlyContinue) {
              Write-Host "Installing OpenVPN Community $pinnedVersion via winget..."
              winget install --id OpenVPNTechnologies.OpenVPN --exact --version $pinnedVersion --accept-package-agreements --accept-source-agreements --silent
              if (-not (Test-Path $exe)) {
                Write-Host "Pinned version $pinnedVersion unavailable in winget; installing latest..."
                winget install --id OpenVPNTechnologies.OpenVPN --exact --accept-package-agreements --accept-source-agreements --silent
              }
            }
          }
          if (-not (Test-Path $exe)) {
            Write-Host "Falling back to Chocolatey OpenVPN install..."
            choco install openvpn --yes --no-progress
          }
          if (-not (Test-Path $exe)) {
            throw "OpenVPN executable not found at $exe after install"
          }
          & $exe --version | Select-Object -First 3

      - name: Run real OpenVPN Windows E2E tests
        run: cargo test -p openwrap-core --test windows_openvpn_e2e -- --ignored --nocapture

      - name: Build OpenWrap installer (unsigned)
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - name: Verify app manifest and NSIS install/uninstall
        shell: pwsh
        run: |
          $appExe = "target/release/openwrap-app.exe"
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes((Resolve-Path $appExe)))
          if (-not $text.Contains("requireAdministrator")) {
            throw "openwrap-app.exe is missing requireAdministrator manifest"
          }
          Write-Host "Confirmed: openwrap-app.exe embeds requireAdministrator."

          $installer = Get-ChildItem -Path target/release/bundle/nsis -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          $installDir = Join-Path $env:TEMP "openwrap-nsis-test"
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }

          Write-Host "Running silent install of $($installer.Name) to $installDir..."
          $p = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent install exited with $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $installDir "openwrap-app.exe"))) {
            throw "Installed openwrap-app.exe not found in $installDir"
          }
          $uninstaller = Join-Path $installDir "uninstall.exe"
          if (-not (Test-Path $uninstaller)) {
            throw "uninstall.exe not found in $installDir"
          }

          Write-Host "Running silent uninstall..."
          $u = Start-Process -FilePath $uninstaller -ArgumentList "/S", "_?=$installDir" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Silent uninstall exited with $($u.ExitCode)" }
          if (Test-Path (Join-Path $installDir "openwrap-app.exe")) {
            throw "openwrap-app.exe still exists after uninstall"
          }
          Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue
          Write-Host "Confirmed: NSIS silent install and uninstall succeeded."

      - uses: actions/upload-artifact@v4
        with:
          name: openwrap-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
