# Builds and publishes an OpenWrap release when a v* tag is pushed
# (scripts/release.sh does the bump + tag + push).
#
# Free: the repository is public, so GitHub-hosted macOS runners cost nothing.
# No Apple Developer account: the app is ad-hoc signed; updates are verified
# with the minisign key whose private half lives in the
# TAURI_SIGNING_PRIVATE_KEY repository secret (public half in tauri.conf.json).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Apple Silicon runner; OpenWrap ships arm64 only.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Read release notes from the tag message
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          NOTES=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | sed '/-----BEGIN/,$d')
          [ -n "$NOTES" ] || NOTES="OpenWrap $VERSION"
          {
            echo "RELEASE_NOTES<<__NOTES__"
            echo "$NOTES"
            echo "__NOTES__"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: |
          npm test
          cargo build -p openwrap-helper --release
          cargo test -p openwrap-core -p openwrap-app

      - name: Build OpenWrap.app
        run: npx --yes @tauri-apps/cli@2 build --bundles app

      - name: Package release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_CLI: npx --yes @tauri-apps/cli@2
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is not set"
            exit 1
          fi
          scripts/package-release.sh target/release/bundle/macos/OpenWrap.app dist-release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "OpenWrap ${VERSION}" \
            --notes "${RELEASE_NOTES}

          **First install:** download \`OpenWrap-Share.zip\`, unzip it and run \`setup.sh\` (see README-FIRST.txt).
          **Already installed:** OpenWrap offers this update automatically when it starts." \
            dist-release/OpenWrap-Share.zip \
            dist-release/OpenWrap.app.tar.gz \
            dist-release/OpenWrap.app.tar.gz.sig \
            dist-release/latest.json
