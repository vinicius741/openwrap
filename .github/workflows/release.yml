# Builds and publishes an OpenWrap release when a v* tag is pushed
# (scripts/release.sh does the bump + tag + push).
#
# The macOS job creates the release as a draft, the Windows job attaches the
# signed installer, and the publish job adds Windows to latest.json and makes
# the release public. Installed apps (both platforms) only see the release
# once every update file is in place.
#
# Free: the repository is public, so GitHub-hosted macOS runners cost nothing.
# No Apple Developer account: the app is ad-hoc signed; updates are verified
# with the minisign key whose private half lives in the
# TAURI_SIGNING_PRIVATE_KEY repository secret (public half in tauri.conf.json).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Apple Silicon runner; OpenWrap ships arm64 only.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Read release notes from the tag message
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          NOTES=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | sed '/-----BEGIN/,$d')
          [ -n "$NOTES" ] || NOTES="OpenWrap $VERSION"
          {
            echo "RELEASE_NOTES<<__NOTES__"
            echo "$NOTES"
            echo "__NOTES__"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: |
          npm test
          cargo build -p openwrap-helper --release
          cargo test -p openwrap-core -p openwrap-app

      - name: Build OpenWrap.app
        run: npx --yes @tauri-apps/cli@2 build --bundles app

      - name: Package release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_CLI: npx --yes @tauri-apps/cli@2
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is not set"
            exit 1
          fi
          scripts/package-release.sh target/release/bundle/macos/OpenWrap.app dist-release

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "OpenWrap ${VERSION}" \
            --notes "${RELEASE_NOTES}

          **First install (Mac):** download \`OpenWrap-Share.zip\`, unzip it and double-click \`Setup.command\` (see README-FIRST.txt).
          **First install (Windows, experimental):** download \`OpenWrap-Windows-Setup.exe\` and run it. It also offers to install OpenVPN.
          **Already installed:** OpenWrap offers this update automatically when it starts. Windows copies at version 0.3.2 or earlier cannot update themselves: run the new \`OpenWrap-Windows-Setup.exe\` once over the old install: profiles, settings and saved usernames are kept, and later updates are automatic." \
            dist-release/OpenWrap-Share.zip \
            dist-release/OpenWrap.app.tar.gz \
            dist-release/OpenWrap.app.tar.gz.sig \
            dist-release/latest.json

  # Windows installer, attached to the draft release under a fixed name so
  # https://github.com/<repo>/releases/latest/download/OpenWrap-Windows-Setup.exe
  # always points at the newest one. Not code signed (no paid certificate); the
  # publish job signs it with the free minisign updater key so installed copies
  # can update themselves.
  windows-installer:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Build OpenWrap installer
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - name: Attach installer to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem -Path target/release/bundle/nsis -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          Copy-Item $installer.FullName OpenWrap-Windows-Setup.exe
          gh release upload "$env:GITHUB_REF_NAME" OpenWrap-Windows-Setup.exe --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed (exit $LASTEXITCODE)" }

  # Signs the Windows installer with the updater key, adds it to latest.json
  # and publishes the draft. Signing runs here rather than on the Windows runner
  # because the key has an empty password, and Windows cannot hold an empty
  # TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the CLI would then prompt for one).
  # If a build job fails the release stays a draft; re-run the failed job.
  publish:
    needs: [release, windows-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sign Windows installer, add it to latest.json and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is not set"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist-publish
          gh release download "${GITHUB_REF_NAME}" --dir dist-publish \
            --pattern latest.json --pattern OpenWrap-Windows-Setup.exe
          npx --yes @tauri-apps/cli@2 signer sign --app-version "$VERSION" \
            dist-publish/OpenWrap-Windows-Setup.exe
          test -s dist-publish/OpenWrap-Windows-Setup.exe.sig
          node scripts/add-windows-update.mjs dist-publish/latest.json \
            dist-publish/OpenWrap-Windows-Setup.exe.sig \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/OpenWrap-Windows-Setup.exe"
          gh release upload "${GITHUB_REF_NAME}" --clobber \
            dist-publish/OpenWrap-Windows-Setup.exe.sig dist-publish/latest.json
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
